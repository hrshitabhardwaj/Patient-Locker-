# Render's free plan puts the API to sleep after 15 idle minutes; the first request after
# that takes about a minute. This pings the health check so query letters are processed at
# once. GitHub may delay scheduled runs by a few minutes.
name: keep-api-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 120 https://patient-locker-backend.onrender.com/api/v1/health
