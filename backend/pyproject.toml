[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "patient-locker"
version = "0.1.0"
description = "Patient document locker and automated insurer query response"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "python-multipart>=0.0.18",
    "cryptography>=44",
    "pypdfium2>=4.30,<6",
    "pillow>=11",
    "phonenumbers>=8.13,<10",
    "pytesseract>=0.3.13",
    "httpx2>=2.16,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    # Only used to build password-protected PDFs for upload tests.
    "pypdf>=5",
    # Only used to build text PDFs (query letters) for tests.
    "reportlab>=4",
    # Browser walkthrough (make test-e2e); drives the installed Chrome.
    "playwright>=1.48",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not ollama'"
markers = [
    "ollama: calls the real local model; run with `make test-llm`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Template paragraphs are kept word for word on one line each.
"app/messaging/templates.py" = ["E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]
known-first-party = ["app", "tests", "scripts"]
