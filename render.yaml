# Render Blueprint for the API. The existing service was created in the dashboard; keep
# its settings in step with this file (or apply it via Blueprints → New Blueprint Instance).
services:
  - type: web
    name: patient-locker-backend
    # Docker (backend/Dockerfile) so Tesseract OCR is available for scanned letters.
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # The image runs scripts/render_start.sh: migrations, the job worker, then the API.
    healthCheckPath: /api/v1/health
    plan: free
    # The free plan's disk is wiped on every restart, so documents are stored (encrypted)
    # in PostgreSQL instead: FILE_STORE=database below.
    envVars:
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://patient-locker-backend.onrender.com
      - key: CORS_ORIGINS
        value: https://patient-locker.vercel.app
      # The Render Postgres "Internal Database URL" (postgresql://... is accepted as is).
      - key: DATABASE_URL
        sync: false
      # Generate once with: python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())"
      # Never change it afterwards: stored files can only be read with the same key.
      - key: FILE_ENCRYPTION_KEY
        sync: false
      - key: FILE_STORE
        value: database
      # Gemini (free key from Google AI Studio) checks pages for signatures and stamps and
      # double-checks letter points. Free-tier content may be used by Google to improve its
      # products. Without a key, everything still runs on rules (signed/stamped requests are
      # then held for staff review).
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_REQUESTS_PER_MINUTE
        value: "10"
      # Fewer pages per document keeps within the free daily quota.
      - key: LLM_PROFILE_MAX_PAGES
        value: "2"
      # WhatsApp through the Twilio sandbox. Recipients must first send the sandbox's
      # "join <code>" message to the sandbox number.
      - key: WHATSAPP_PROVIDER
        value: twilio
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # The sandbox number, e.g. +14155238886 (no "whatsapp:" prefix)
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      # Email through Brevo's HTTPS API: Render's free plan blocks outgoing SMTP ports.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      # A sender address verified in Brevo, e.g. "Claims Desk <you@gmail.com>"
      - key: EMAIL_FROM
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SUPPORT_PHONE
        sync: false
